[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pathology-crop-tool"
version = "0.2.0"
description = "批量裁剪 SDPC 病理切片中的汇管区"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "sdpc-for-python>=1.0,<2",
    "numpy>=1.24,<2",
    "Pillow>=10,<11",
    "tifffile>=2024,<2027",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<2",
    "scikit-learn>=1.3,<2",
]
