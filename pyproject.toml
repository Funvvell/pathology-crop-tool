[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-crop-tool"
version = "0.8.1"
description = "批量裁剪 SDPC 病理切片中的汇管区"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "sdpc-for-python>=1.0,<2",
    "numpy>=1.24",
    "Pillow>=10",
    "tifffile>=2024,<2027",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<2",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "deepliif>=1.2.6,<2",
    "requests>=2.28,<3",
]

# 主题样式表与 QSS 引用的箭头图标，必须随包分发，
# 否则 pip install（非 -e）后 load_theme() 读不到文件，UI 样式全部丢失。
[tool.setuptools.package-data]
liver_portal_crop = ["*.qss", "*.png"]
