name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install PySide6>=6.6 sdpc-for-python>=1.0 numpy Pillow tifffile scipy scikit-image scikit-learn requests pyinstaller
          pip install deepliif --no-deps

      - name: Build exe
        run: pyinstaller build.spec --noconfirm

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/病理裁剪工具.exe
          generate_release_notes: true
